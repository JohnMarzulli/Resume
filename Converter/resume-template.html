<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John Marzulli — Résumé</title>
<meta name="description" content="Résumé of John Marzulli — Engineering Manager &amp; Quality Engineering.">
<style>
  :root {
    --bg: #f5f6f4;
    --surface: #ffffff;
    --ink: #1c2027;
    --ink-soft: #4b5563;
    --ink-faint: #7a8390;
    --line: #dadfe3;
    --line-strong: #b9c0c7;
    --accent: #2a4b7c;
    --accent-soft: #eef2f7;
    --accent-2: #a06a2c;

    --serif: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;

    --measure: 66ch;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c;
      --surface: #1b1f26;
      --ink: #e8eaed;
      --ink-soft: #a7aeb8;
      --ink-faint: #757e89;
      --line: #2c323b;
      --line-strong: #3b424c;
      --accent: #8fb0dc;
      --accent-soft: #202836;
      --accent-2: #d9a85c;
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171c;
    --surface: #1b1f26;
    --ink: #e8eaed;
    --ink-soft: #a7aeb8;
    --ink-faint: #757e89;
    --line: #2c323b;
    --line-strong: #3b424c;
    --accent: #8fb0dc;
    --accent-soft: #202836;
    --accent-2: #d9a85c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); text-decoration-color: var(--line-strong); text-underline-offset: 2px; }
  a:hover { text-decoration-color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sheet {
    max-width: 920px;
    margin: 0 auto;
    padding: 4.5rem 2rem 6rem;
  }

  /* ---------- Header ---------- */

  header.masthead {
    padding-bottom: 2.25rem;
    border-bottom: 1px solid var(--line-strong);
    margin-bottom: 2.75rem;
  }

  h1.name {
    font-size: clamp(2.1rem, 4vw, 2.75rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 0.35rem;
    text-wrap: balance;
  }

  .role-line {
    font-family: var(--mono);
    font-size: 0.92rem;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 0.15rem;
  }

  .locale-line {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--ink-faint);
    margin: 0 0 1.1rem;
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    font-family: var(--mono);
    font-size: 0.85rem;
  }

  .contact-row a { color: var(--ink-soft); }
  .contact-row a:hover { color: var(--accent); }

  /* ---------- Layout ---------- */

  .layout {
    display: grid;
    grid-template-columns: 210px 1fr;
    gap: 3rem;
    align-items: start;
  }

  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; gap: 2.5rem; }
    aside { order: 2; }
    main { order: 1; }
  }

  aside {
    position: sticky;
    top: 2rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  @media (max-width: 720px) {
    aside { position: static; }
  }

  .side-block h2 {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 0.75rem;
    font-weight: 600;
  }

  .side-block ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .side-block li {
    font-size: 0.92rem;
    color: var(--ink-soft);
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .chip {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--ink-soft);
    border: 1px solid var(--line-strong);
    padding: 0.15rem 0.5rem;
    line-height: 1.6;
    white-space: nowrap;
  }

  .edu-school {
    font-weight: 600;
    color: var(--ink);
    font-size: 0.95rem;
  }

  .edu-degree { font-size: 0.88rem; color: var(--ink-soft); margin-top: 0.2rem; }

  .edu-years {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-faint);
    margin-top: 0.2rem;
  }

  /* ---------- Main sections ---------- */

  main > section { margin-bottom: 3rem; }

  main h2.section-title {
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 1.1rem;
    font-weight: 600;
  }

  .summary p {
    margin: 0 0 0.85rem;
    color: var(--ink-soft);
    max-width: var(--measure);
  }
  .summary p:last-child { margin-bottom: 0; }

  /* ---------- Experience timeline ---------- */

  .timeline {
    position: relative;
    padding-left: 1.4rem;
    border-left: 1px solid var(--line);
  }

  .company-group {
    margin-bottom: 2.4rem;
  }
  .company-group:last-child { margin-bottom: 0; }

  .company-name {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 1rem;
    position: relative;
  }

  .company-name::before {
    content: "";
    position: absolute;
    left: -1.585rem;
    top: 0.45em;
    width: 7px;
    height: 7px;
    background: var(--surface);
    border: 1.5px solid var(--accent);
    transform: rotate(45deg);
  }

  .role {
    margin-bottom: 1.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--line);
  }
  .role:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

  .role-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.25rem 1rem;
    margin-bottom: 0.6rem;
  }

  .role-title {
    font-weight: 600;
    font-size: 1rem;
    color: var(--ink);
  }

  .role-when {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .role ul.bullets {
    margin: 0;
    padding-left: 1.1rem;
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .role ul.bullets li { padding-left: 0.15rem; }

  .theme-label {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 1rem 0 0.5rem;
  }
  .theme-label:first-of-type { margin-top: 0; }

  /* ---------- Projects ---------- */

  .project-list {
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .project {
    padding-bottom: 1.75rem;
    border-bottom: 1px solid var(--line);
  }
  .project:last-child { padding-bottom: 0; border-bottom: none; }

  .project-name {
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 0.6rem;
    color: var(--ink);
  }

  .project-desc {
    margin: 0 0 0.5rem;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  .project-tech {
    margin: 0 0 0.4rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-faint);
    font-style: italic;
  }

  .project-link {
    margin: 0;
    font-family: var(--mono);
    font-size: 0.78rem;
  }

  footer.colophon {
    margin-top: 3.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--ink-faint);
  }

  @media print {
    body { background: #fff; color: #000; }
    .sheet { max-width: none; padding: 0; }
    aside { position: static; }
    .role { break-inside: avoid; }
    .company-group { break-inside: avoid-page; }
  }
</style>
</head>
<body>

<div class="sheet">

  <header class="masthead">
    <h1 class="name"><!-- NAME --></h1>
    <p class="role-line"><!-- ROLE --></p>
    <p class="locale-line"><!-- LOCATION --></p>
    <div class="contact-row">
      <!-- CONTACT -->
    </div>
  </header>

  <div class="layout">

    <aside>
      <div class="side-block">
        <h2>Top Skills</h2>
        <ul>
          <!-- SKILLS -->
        </ul>
      </div>

      <div class="side-block">
        <h2>Core Technologies</h2>
        <div class="chip-row">
          <!-- TECHNOLOGIES -->
        </div>
      </div>

      <div class="side-block">
        <h2>Education</h2>
        <!-- EDUCATION -->
      </div>
    </aside>

    <main>

      <section class="summary">
        <h2 class="section-title">Summary</h2>
        <!-- SUMMARY -->
      </section>

      <section class="experience">
        <h2 class="section-title">Professional Experience</h2>
        <div class="timeline">
          <!-- EXPERIENCE -->
        </div>
      </section>

      <section class="projects">
        <h2 class="section-title">Open Source Projects</h2>
        <div class="project-list">
          <!-- PROJECTS -->
        </div>
      </section>

    </main>
  </div>

  <footer class="colophon">Résumé of John Marzulli — updated 2026</footer>

</div>

</body>
</html>
